name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    env:
      BETTER_AUTH_SECRET: ci-only-secret-that-is-never-used-in-production
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm run build

  docker-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: BETTER_AUTH_SECRET=ci-only-placeholder docker compose config --quiet
      - run: docker compose -f docker-compose.dev.yml config --quiet
