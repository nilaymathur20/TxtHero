name: Publish Recovery Release

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Full 40-character known-good commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      BETTER_AUTH_SECRET: recovery-build-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate recovery inputs
        shell: bash
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
          cp scripts/prepare-release.mjs /tmp/txthero-prepare-release.mjs
      - name: Check out exact known-good commit
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: git checkout --detach "$TARGET_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Require an update-capable recovery source
        run: |
          node -e "const p=require('./package.json'); if(!p.dependencies?.['electron-updater'] || p.build?.publish?.provider !== 'github') throw new Error('target commit predates GitHub update support')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: npm ci --prefix frontend --legacy-peer-deps
      - run: python -m venv backend/venv
      - run: backend/venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt pyinstaller
      - name: Stamp recovery release metadata
        shell: bash
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          RECOVERY_VERSION="1.$(date -u +%Y%m%d).$(date -u +%s)"
          node /tmp/txthero-prepare-release.mjs "$RECOVERY_VERSION" "$TARGET_COMMIT" "recovery" "v$RECOVERY_VERSION"
      - run: backend/venv/bin/python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
      - run: npm audit --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm run build
      - run: npm run build:backend:linux
      - name: Publish recovery as a newer GitHub release
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
